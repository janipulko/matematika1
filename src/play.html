<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vesela matematika</title>
  <meta name="theme-color" content="#26C6DA">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>


    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-attachment: fixed;
    }
  </style>
  <script type="module">

    import {initDynamicBackground} from './utils/background.js';
    import {applyRandomPalette} from "./utils/palettes.js";

    (function () {
      applyRandomPalette();
      initDynamicBackground();
    })();
    window.applyRandomPalette = applyRandomPalette;
  </script>
  <style>

    * {
      box-sizing: border-box
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans", Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--ink);
    }

    .app {
      max-width: 920px;
      margin: 7vh auto;
      padding: 16px;
      height: 86vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    .settings-trigger, .reset-trigger {
      position: absolute;
      top: 10px;
      background: rgba(255, 255, 255, 0.4);
      border: none;
      border-radius: var(--radius-sm);
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      color: var(--ink);
      transition: all 0.2s;
      z-index: 10;
      backdrop-filter: blur(4px);
    }

    .settings-trigger {
      right: 15px;
    }

    .reset-trigger {
      left: 15px;
    }

    session-score {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .settings-trigger:hover, .reset-trigger:hover {
      background: var(--primary);
      color: var(--on-primary, white);
    }

    .settings-trigger:hover {
      transform: rotate(30deg);
    }

    .reset-trigger:hover {
      transform: rotate(-90deg);
    }

    @media (max-width: 480px) {
      .settings-trigger, .reset-trigger {
        top: 5px;
        width: 36px;
        height: 36px;
        font-size: 18px;
      }

      .settings-trigger {
        right: 10px;
      }

      .reset-trigger {
        left: 10px;
      }

      session-score {
        top: 5px;
      }
    }


  </style>
  <script type="module" src="components/MathGame.js"></script>
</head>
<body>
<session-score></session-score>
<button class="reset-trigger" title="Ponastavi"
        onclick="document.querySelector('math-game').onReset()">↺
</button>
<button class="settings-trigger" title="Nastavitve"
        onclick="document.querySelector('math-game').settingsTrigger.click()">⚙️
</button>
<div class="app">

  <math-game></math-game>


</div>


<script src="utils/music.js"></script>
</body>
</html>
